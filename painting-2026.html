<div class="lightbox" id="lightbox">
  <div class="lightbox-bg" onclick="closeLightbox()"></div>
  <button class="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
  <button class="lightbox-prev" onclick="shiftLightbox(-1)">&#8592;</button>
  <div class="lightbox-content">
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <div class="lightbox-desc" id="lightboxDesc"></div>
  </div>
  <button class="lightbox-next" onclick="shiftLightbox(1)">&#8594;</button>
</div>

<script>
  let cur = 0;
  const srcs = [
    'images/IMG_4717.PNG',
    'images/IMG_4710.PNG',
    'images/IMG_4711.PNG',
    'images/IMG_4718.PNG',
    'images/IMG_4720.PNG',
    'images/IMG_4712.PNG',
    'images/IMG_4723.PNG',
    'images/IMG_4733.PNG'
  ];
  const descs = [
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    ''
  ];

  document.querySelectorAll('.gallery-item').forEach(item => {
    item.addEventListener('click', () => openLightbox(parseInt(item.dataset.index)));
  });

  function openLightbox(i) {
    cur = i;
    document.getElementById('lightboxImg').src = srcs[i];
    document.getElementById('lightboxDesc').innerHTML = descs[i];
    document.getElementById('lightbox').style.display = 'flex';
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  function shiftLightbox(dir) {
    if (srcs.length === 0) return;
    cur = (cur + dir + srcs.length) % srcs.length;
    document.getElementById('lightboxImg').src = srcs[cur];
    document.getElementById('lightboxDesc').innerHTML = descs[cur];
  }

  document.addEventListener('keydown', e => {
    if (document.getElementById('lightbox').style.display !== 'flex') return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') shiftLightbox(-1);
    if (e.key === 'ArrowRight') shiftLightbox(1);
  });

  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });
</script>
